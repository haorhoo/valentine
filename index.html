<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valentine</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#5a3a2e,#7b5142);
  overflow:hidden;
  font-family:'Playfair Display',serif;
}/* floating hearts */ .heart{ position:absolute; color:rgba(255,255,255,.25); animation:float 10s linear infinite; } @keyframes float{ from{transform:translateY(100vh) scale(.6)} to{transform:translateY(-10vh) scale(1.2)} }

/* envelope */ .envelope{ position:relative; width:320px; height:220px; background:#e9dcd4; border-radius:10px; box-shadow:0 20px 40px rgba(0,0,0,.25); cursor:pointer; transition:.5s; }

.flap{ position:absolute; top:0; left:0; width:100%; height:100%; background:#d8c5bb; clip-path:polygon(0 0,100% 0,50% 60%); transform-origin:top; transition:.6s; z-index:3; }

.letter{ position:absolute; width:90%; height:90%; background:#fff9f6; top:5%; left:5%; border-radius:16px; padding:28px 24px; box-sizing:border-box; transform:translateY(40px); opacity:0; transition:.7s; text-align:center; }

.open .flap{ transform:rotateX(180deg); } .open .letter{ transform:translateY(-40px); opacity:1; }

.title{ font-family:'Great Vibes',cursive; font-size:38px; color:#b36b5e; margin-bottom:14px; }

.text{ font-size:18px; color:#5a4037; line-height:1.6; min-height:120px; }

.love{ font-size:28px; margin-top:10px; opacity:0; transition:1s; } .open .love{opacity:1} </style>

</head>
<body><div class="envelope" id="env">
  <div class="flap"></div>
  <div class="letter">
    <div class="title">Untukmu</div>
    <div class="text" id="typing"></div>
    <div class="love">❤</div>
  </div>
</div><script>
// hearts background
for(let i=0;i<18;i++){
  const h=document.createElement('div');
  h.className='heart';
  h.innerHTML='❤';
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(10+Math.random()*20)+'px';
  h.style.animationDuration=(6+Math.random()*8)+'s';
  document.body.appendChild(h);
}

// open envelope
const env=document.getElementById('env');
const text=`Selamat hari Valentine. Semoga hari ini terasa hangat, pelan, dan manis seperti coklat favoritmu. Semoga hal kecil hari ini bisa bikin kamu senyum tanpa sadar. Dan kalau dunia lagi capek, semoga kamu ingat masih ada rasa hangat yang diam diam jagain kamu.`;

let typed=false;

env.onclick=()=>{
 env.classList.toggle('open');
 if(!typed){
   typed=true;
   typeText(text);
 }
}

function typeText(str){
 const el=document.getElementById('typing');
 const words=str.split(' ');
 let i=0;
 function add(){
   if(i<words.length){
     el.innerHTML+=words[i]+' ';
     i++;
     setTimeout(add,180);
   }
 }
 add();
}
</script></body>
</html>
