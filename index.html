<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valentine Fantasy</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#2b1d1a,#120c0b);overflow:hidden;font-family:'Playfair Display',serif}

/* ENVELOPE */
.envelope{position:absolute;width:320px;height:220px;background:#e0cfc2;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.4);cursor:pointer;transition:1s ease;z-index:5}
.flap{position:absolute;width:100%;height:100%;background:#d2b7a7;clip-path:polygon(0 0,100% 0,50% 60%);transform-origin:top;transition:1s}
.open .flap{transform:rotateX(180deg)}
.fly{animation:flyAway 2.5s forwards ease-in}
@keyframes flyAway{100%{transform:translate(450px,-220px) scale(.2) rotate(60deg);opacity:0}}

/* VINTAGE PAPER (lebih kecil & responsif) */
.paper{position:absolute;width:min(340px,86vw);min-height:260px;background:
 radial-gradient(circle at 50% 30%,#f6e7c1,#d8be83 60%,#b09052),
 repeating-linear-gradient(0deg,rgba(0,0,0,.05),rgba(0,0,0,.05) 1px,transparent 1px,transparent 4px);
 border:2px solid #9e7b3f;border-radius:12px;padding:28px 24px 48px 24px;
 box-shadow:0 0 60px rgba(255,215,120,.25), inset 0 0 40px rgba(120,80,20,.35);
 transform:scale(.6);opacity:0;transition:1.2s ease;text-align:center}
.showPaper{transform:scale(1);opacity:1}
.fadeOutPaper{animation:burnAway 2s forwards ease-in}
@keyframes burnAway{0%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(100% 0 0 0);opacity:0}}

.title{font-family:'Cinzel',serif;font-size:24px;margin-bottom:18px;text-shadow:0 0 12px rgba(255,220,150,.7)}
.text{font-size:16px;line-height:1.7;min-height:110px;text-shadow:0 0 6px rgba(255,220,150,.4)}

.love{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:24px;opacity:0}
.showLove{opacity:1;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.25)}}

/* BUTTERFLIES */
.butterfly{position:absolute;font-size:22px;animation:butterflyPass linear forwards}
@keyframes butterflyPass{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-600px,-500px);opacity:0}}

/* BAG */
.bagWrap{
  position:absolute;
  left:50%;
  bottom:-250px;
  transform:translateX(-50%);
  opacity:0;
  transition:1.5s ease;
}

.bagWrap.show{
  bottom:80px;
  opacity:1;
}

/* tali gantung */
.bagWrap::before{
  content:"";
  position:absolute;
  top:-120px;
  left:50%;
  width:2px;
  height:120px;
  background:rgba(255,255,255,.6);
  transform:translateX(-50%);
}

/* ===== CELLOPHANE BAG ===== */

.bag{
  width:120px;
  height:180px;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,.65),
    rgba(255,255,255,.15) 40%,
    rgba(255,255,255,.35)
  );
  border-radius:12px;
  position:relative;
  box-shadow:
    inset 0 0 18px rgba(255,255,255,.7),
    inset 0 -12px 20px rgba(255,255,255,.25);
  animation:swing 3s ease-in-out infinite;
  overflow:visible;
  z-index:2;
}

/* kilap plastik */
.bag::before{
  content:"";
  position:absolute;
  left:10px;
  top:20px;
  width:25px;
  height:120px;
  background:linear-gradient(
    to right,
    rgba(255,255,255,.7),
    rgba(255,255,255,0)
  );
  transform:skewX(-12deg);
  z-index:1;
}

/* lipatan atas plastik */
.bag::after{
  content:"";
  position:absolute;
  top:-35px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:45px solid transparent;
  border-right:45px solid transparent;
  border-bottom:35px solid rgba(255,255,255,.55);
  filter:blur(.3px);
  z-index:1;
}

/* pita jepang */
.ribbon{
  width:70px;
  height:18px;
  background:#d24a6a;
  position:absolute;
  top:-12px;
  left:50%;
  transform:translateX(-50%);
  border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}

.ribbon::before,
.ribbon::after{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  background:#d24a6a;
  border-radius:50%;
  top:-6px;
}

.ribbon::before{ left:-12px; }
.ribbon::after{ right:-12px; }

/* coklat hati stabil */
.choco{
  position:absolute;
  width:45px;
  height:45px;
  background:#4a2a1e;
  transform:rotate(-45deg);
  bottom:35px;
  z-index:5;
  box-shadow:
    inset -6px -6px 8px rgba(0,0,0,.35),
    inset 6px 6px 8px rgba(255,255,255,.15);
}

.choco::before,
.choco::after{
  content:"";
  position:absolute;
  width:45px;
  height:45px;
  background:inherit;
  border-radius:50%;
}

.choco::before{ top:-22px; left:0; }
.choco::after{ left:22px; top:0; }

.choco:nth-child(2){ left:20px; }
.choco:nth-child(3){ right:20px; }
</style>
</head>
<body>

<audio id="bgMusic" src="bg.mp3" autoplay loop preload="auto"></audio>

<div class="envelope" id="env"><div class="flap"></div></div>

<div class="paper" id="paper"><div class="title">Untukmu</div><div class="text" id="typing"></div><div class="love" id="love">❤</div></div>

<div class="gift" id="gift"><div class="plastic"><div class="ribbon"></div><div class="choco">🍫</div><div class="choco">🍫</div></div></div>

<script>
const env=document.getElementById('env');
const paper=document.getElementById('paper');
const love=document.getElementById('love');
const gift=document.getElementById('gift');
const message=`Selamat hari Valentine. Semoga hari ini terasa hangat, pelan, dan manis seperti coklat favoritmu.`;
let opened=false;

env.onclick=()=>{
 if(opened) return;
 opened=true;
 env.classList.add('open');
 setTimeout(()=>env.classList.add('fly'),800);
 setTimeout(()=>{paper.classList.add('showPaper');typeText(message)},1200);
};

function typeText(text){
 const el=document.getElementById('typing');
 const words=text.split(' ');
 let i=0;
 function add(){
  if(i<words.length){el.innerHTML+=words[i]+' ';i++;setTimeout(add,170)}
  else{love.classList.add('showLove');setTimeout(()=>{paper.classList.add('fadeOutPaper');setTimeout(showFinalScene,2000)},2000)}
 }
 add();
}

function showFinalScene(){
 // banyak kupu kupu romantis
 for(let i=0;i<18;i++){
  const b=document.createElement('div');
  b.className='butterfly';
  b.innerHTML='🦋';
  b.style.right=Math.random()*200+'px';
  b.style.bottom=Math.random()*200+'px';
  b.style.animationDuration=(3+Math.random()*3)+'s';
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),6000);
 }
 gift.classList.add('showGift');
}
</script>
</body>
</html>
