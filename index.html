<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valentine Letter</title>
<style>
:root{--brown:#5b3a2e;--cream:#f4e6d7;--accent:#d24a6a}
body{margin:0;height:100vh;background:radial-gradient(circle at 50% 30%,#8b5e4c,#3a251d);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;overflow:hidden}
.stage{position:relative;width:100%;height:100%}/* ENVELOPE */ .envelope{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:220px;height:140px;background:linear-gradient(#e9d7c6,#caa68a);border-radius:6px;box-shadow:0 10px 25px rgba(0,0,0,.4);cursor:pointer} .envelope:before{content:"";position:absolute;left:0;top:-70px;border-left:110px solid transparent;border-right:110px solid transparent;border-bottom:70px solid #d9b99e;transform-origin:bottom;transition:.8s} .envelope.open:before{transform:rotateX(180deg)}

/* PAPER */ .paper{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%) scale(.6);width:320px;height:420px;background:linear-gradient(#f8f1e6,#efe0c8);border-radius:6px;box-shadow:0 25px 60px rgba(0,0,0,.5);opacity:0;transition:1s} .paper.show{opacity:1;transform:translate(-50%,-50%) scale(1)} .paper:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:140px;background:linear-gradient(to top,rgba(0,0,0,.55),transparent);animation:burn 5s forwards 6s} @keyframes burn{to{opacity:0;transform:translateY(160px)}}

.text{padding:50px 40px;text-align:center;color:#4b2f24;font-size:22px;line-height:1.6} .word{opacity:0;display:inline-block;margin:0 3px;transform:translateY(10px)} .word.show{animation:appear .6s forwards} @keyframes appear{to{opacity:1;transform:none}}

/* HEART FOLLOWER */ .heart{position:absolute;font-size:26px;color:#ff6b8f;opacity:0;transition:.5s}

/* BUTTERFLY */ .butterfly{position:absolute;font-size:22px;opacity:0;animation:fly 6s linear forwards} @keyframes fly{0%{transform:translate(-200px,200px) scale(.6)}100%{transform:translate(120vw,-40vh) scale(1.2)}}

/* BAG */ .bagWrap{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);opacity:0} .bagWrap.show{opacity:1} .bag{width:120px;height:180px;background:linear-gradient(to bottom,rgba(255,255,255,.65),rgba(255,255,255,.15) 40%,rgba(255,255,255,.35));border-radius:12px;position:relative;box-shadow:inset 0 0 18px rgba(255,255,255,.7),inset 0 -12px 20px rgba(255,255,255,.25);animation:swing 3s ease-in-out infinite} @keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}} .bag:before{content:"";position:absolute;left:10px;top:20px;width:25px;height:120px;background:linear-gradient(to right,rgba(255,255,255,.7),rgba(255,255,255,0));transform:skewX(-12deg)} .bag:after{content:"";position:absolute;top:-35px;left:50%;transform:translateX(-50%);border-left:45px solid transparent;border-right:45px solid transparent;border-bottom:35px solid rgba(255,255,255,.55)} .ribbon{width:70px;height:18px;background:#d24a6a;position:absolute;top:-12px;left:50%;transform:translateX(-50%);border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.25)} .ribbon:before,.ribbon:after{content:"";position:absolute;width:20px;height:20px;background:#d24a6a;border-radius:50%;top:-6px} .ribbon:before{left:-12px}.ribbon:after{right:-12px} .choco{position:absolute;bottom:20px;width:50px;height:45px;background:#4a2a1e;left:20px;clip-path:path('M25 0 C40 -5 55 15 25 40 C-5 15 10 -5 25 0 Z');box-shadow:inset -6px -6px 8px rgba(0,0,0,.35),inset 6px 6px 8px rgba(255,255,255,.15)} .choco:nth-child(3){left:auto;right:20px} </style>

</head>
<body>
<div class="stage">
  <div class="envelope" id="env"></div>
  <div class="paper" id="paper"><div class="text" id="text"></div></div>
  <div class="heart" id="heart">❤</div>
  <div class="bagWrap" id="bag"><div class="bag"><div class="ribbon"></div><div class="choco"></div><div class="choco"></div></div></div>
</div>
<audio id="bg" src="bg.mp3"></audio>
<script>
const msg="Selamat Hari Valentine semoga hari ini penuh hangat dan senyum untukmu ❤".split(" ");
const env=document.getElementById('env');
const paper=document.getElementById('paper');
const text=document.getElementById('text');
const heart=document.getElementById('heart');
const bag=document.getElementById('bag');
const bg=document.getElementById('bg');env.onclick=()=>{ bg.play().catch(()=>{}); env.classList.add('open'); setTimeout(()=>paper.classList.add('show'),600); let i=0; const add=()=>{ if(i>=msg.length){setTimeout(()=>bag.classList.add('show'),5000);return} const span=document.createElement('span'); span.className='word';span.textContent=msg[i]; text.appendChild(span); setTimeout(()=>span.classList.add('show'),50); heart.style.opacity=1; heart.style.left=(span.offsetLeft+span.offsetWidth/2)+'px'; heart.style.top=(span.offsetTop+60)+'px'; i++;setTimeout(add,380); }; setTimeout(add,1000); }; </script>

</body>
</html>
